# Render Blueprint: New + > Blueprint > pick this repo. API_KEY is auto-generated (see service Environment tab).
# NOTE: free web services have an ephemeral disk -> the total resets on redeploy/restart.
# For persistence switch plan to "starter" and uncomment the disk block.
services:
  - type: web
    name: car-tracker
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: API_KEY
        generateValue: true
      - key: DATA_FILE
        value: /data/state.json
      - key: DEFAULT_GOAL
        value: "164500"
    # disk:
    #   name: car-tracker-data
    #   mountPath: /data
    #   sizeGB: 1

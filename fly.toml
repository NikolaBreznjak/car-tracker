# fly launch --copy-config --no-deploy ; fly volumes create car_data --size 1 ; fly secrets set API_KEY=$(openssl rand -hex 24) ; fly deploy
app = "car-tracker"
primary_region = "ams"

[build]

[env]
  PORT = "8080"
  DATA_FILE = "/data/state.json"

[mounts]
  source = "car_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
